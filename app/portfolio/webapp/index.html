<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Portfolio Studio</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #content {
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }

      #content > .sapUiComponentContainer,
      #content .sapUiComponentContainer,
      #content .sapUiComponentContainer > div,
      #content .sapUiView,
      #content .sapMNav,
      #content .sapMNavItem {
        height: 100vh !important;
        min-height: 100vh !important;
      }

      #content .sapFDynamicPage {
        min-height: 100vh;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resourceroots='{"innovation.portfolio.app": "./"}'
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-frameOptions="trusted">
    </script>
  </head>
  <body class="sapUiBody sapUiSizeCompact">
    <div id="content">
      <div
        data-sap-ui-component
        data-name="innovation.portfolio.app"
        data-id="innovation-portfolio"
        data-height="100%"
        data-settings='{"id": "innovation.portfolio.app"}'>
      </div>
    </div>
  </body>
</html>
